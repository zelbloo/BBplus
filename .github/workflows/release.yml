name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore from secrets
        env:
          BBPLUS_KEYSTORE_BASE64: ${{ secrets.BBPLUS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$BBPLUS_KEYSTORE_BASE64" | base64 -d > keystore/bbplus.keystore

      - name: Build release APK
        env:
          BBPLUS_KEYSTORE_PASSWORD: ${{ secrets.BBPLUS_KEYSTORE_PASSWORD }}
          BBPLUS_KEY_ALIAS: ${{ secrets.BBPLUS_KEY_ALIAS }}
          BBPLUS_KEY_PASSWORD: ${{ secrets.BBPLUS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbplus-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk